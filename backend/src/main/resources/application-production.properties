# Railway provides PORT and the MYSQL* values to the application service.
server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?sslMode=VERIFY_IDENTITY&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.demo-data.enabled=false
hostel.admin.username=${HOSTEL_ADMIN_USERNAME:}
hostel.admin.password=${HOSTEL_ADMIN_PASSWORD:}
hostel.admin.name=${HOSTEL_ADMIN_NAME:Chief Warden}

spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=UTC

logging.level.org.springframework.web=INFO
logging.level.com.example.hostel=INFO
